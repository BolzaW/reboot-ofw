[config]
autoboot=4
autoboot_list=0
bootwait=3
backlight=100
noticker=0
autohosoff=2
autonogc=1
updater2p=1
bootprotect=0

[100% STOCK OFW]
payload=bootloader/payloads/reboot_ofw.bin
icon=bootloader/res/ofw.bmp

[SEMI-STOCK (SYSMMC)]
pkg3=atmosphere/package3
stock=1
emummc_force_disable=1
icon=bootloader/res/stock.bmp



[CFW (SYSMMC)]
pkg3=atmosphere/package3
emummc_force_disable=1
icon=bootloader/res/sysnand.bmp



[CFW (EMUMMC)]
payload=bootloader/payloads/fusee.bin
icon=bootloader/res/emummc.bmp
